    networks:
      - appwrite
    environment:
      - 'GEO_SECRET=${_APP_GEO_SECRET:-$SERVICE_PASSWORD_64_GEO}'
    healthcheck:
      test: 'php -r "exit(json_decode(file_get_contents(''http://localhost/v1/health''))->status === ''ok'' ? 0 : 1);"'
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # --------------------------------------------------------------------------
  # Executor - runs function/site containers (needs docker.sock)
  # --------------------------------------------------------------------------
  openruntimes-executor:
    image: 'openruntimes/executor:0.29.0'
    # No container_name: Coolify rewrites container names on deploy, and the
    # executor locates its own container by hostname (Docker partial name
    # match). The hostname must be a substring of the final container name -
    # the service name is, under both Coolify and plain compose.
    hostname: openruntimes-executor
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    stop_signal: SIGINT
    networks:
      - appwrite
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - appwrite-builds:/storage/builds:rw
      - appwrite-functions:/storage/functions:rw
      - appwrite-sites:/storage/sites:rw
      - /tmp:/tmp:rw
    environment:
      - OPR_EXECUTOR_IMAGES=${_APP_EXECUTOR_IMAGES:-openruntimes/node:v5-22,openruntimes/static:v5-1}
      - OPR_EXECUTOR_INACTIVE_THRESHOLD=${_APP_COMPUTE_INACTIVE_THRESHOLD:-600}
      - OPR_EXECUTOR_MAINTENANCE_INTERVAL=${_APP_COMPUTE_MAINTENANCE_INTERVAL:-600}
