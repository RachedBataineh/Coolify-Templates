# ==============================================================================
# Appwrite 2.0 for Coolify - single-file Docker Compose template
# ==============================================================================
# Coolify-ready packaging of the official Appwrite 2.0.0 compose file.
# Full documentation (deploy guide, profiles, scaling, troubleshooting):
#   -> README.md
#
# QUICK START
#   1. Paste this file into a Coolify Docker Compose resource -> Deploy.
#   2. Same hostname on all three routed services, keeping paths:
#      Appwrite /v1 | Console / | Realtime /v1/realtime
#   3. Env tab: _APP_DOMAIN=your.hostname  (required - deploy is blocked
#      until set)
#   4. Appwrite + Realtime services: Advanced -> Path prefixes ->
#      "Keep prefixes"
#   5. Deploy, register the first user (becomes admin).
#   Then see README.md: server prep, builds volume, sites domains, SMTP.
# ==============================================================================
x-logging:
  logging:
    driver: json-file
    options:
      max-file: "5"
      max-size: 10m
services:
  # --------------------------------------------------------------------------
  # API (main appwrite container) - serves /v1 on the shared Coolify domain
  # --------------------------------------------------------------------------
  appwrite:
    # no container_name on purpose: this service can be replicated
    image: '${_APP_IMAGE:-appwrite/appwrite}:${_APP_VERSION:-2.0.0}'
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    healthcheck:
      # Asserts liveness AND the origin allowlist: a missing/wrong
      # _APP_DOMAIN turns this service red within ~1 minute of deploy,
      # instead of failing console login/registration later.
      test:
        - CMD-SHELL
        - 'curl -fsS -o /dev/null -H "Host: $${_APP_DOMAIN:-localhost}" -H "Origin: https://$${_APP_DOMAIN:-localhost}" http://localhost/v1/health/version'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 120s
    networks:
      - appwrite
    volumes:
      - appwrite-uploads:/storage/uploads:rw
      - appwrite-imports:/storage/imports:rw
      - appwrite-cache:/storage/cache:rw
      - appwrite-config:/storage/config:rw
      - appwrite-certificates:/storage/certificates:rw
      - appwrite-functions:/storage/functions:rw
      - appwrite-sites:/storage/sites:rw
      - appwrite-builds:/storage/builds:rw
    depends_on:
      - redis
      - '${_APP_DB_HOST:-postgresql}'
      - appwrite-geo
    environment:
      # The _80 suffix pins the Traefik backend port explicitly; without it
      # Coolify's port auto-detection can pick a wrong port and every /v1
      # request 502s at the proxy.
      - SERVICE_URL_APPWRITE_80=/v1
      # Worker topology switch (Coolify shows this as an editable env var):
      # combined,timers (default) | separate,timers | combined (extra node,
      # no timers) | separate,embedding ...
      # Referencing it here with a default makes Coolify persist it, so the
      # default topology is active on a fresh deploy.
      - 'COMPOSE_PROFILES=${COMPOSE_PROFILES:-combined,timers}'
      - '_APP_ENV=${_APP_ENV:-production}'
      - '_APP_USAGE_STATS=${_APP_USAGE_STATS:-enabled}'
      - '_APP_USAGE_PASS=${_APP_USAGE_PASS:-$SERVICE_PASSWORD_CLICKHOUSE}'
      - '_APP_CONNECTIONS_DB_USAGE=${_APP_CONNECTIONS_DB_USAGE:-http://appwrite:${_APP_USAGE_PASS:-$SERVICE_PASSWORD_CLICKHOUSE}@clickhouse:8123/appwrite}'
      - '_APP_POOL_SIZE_USAGE=${_APP_POOL_SIZE_USAGE:-2}'
      - '_APP_EXECUTIONS_DUAL_WRITE=${_APP_EXECUTIONS_DUAL_WRITE:-enabled}'
      - '_APP_CONNECTIONS_DB_EXECUTIONS=${_APP_CONNECTIONS_DB_EXECUTIONS:-http://appwrite:${_APP_USAGE_PASS:-$SERVICE_PASSWORD_CLICKHOUSE}@clickhouse:8123/appwrite}'
      - '_APP_POOL_SIZE_EXECUTIONS=${_APP_POOL_SIZE_EXECUTIONS:-2}'
      - '_APP_MAINTENANCE_RETENTION_USAGE_TTL=${_APP_MAINTENANCE_RETENTION_USAGE_TTL:-180}'
      - '_APP_STATS_USAGE_QUEUE_NAME=${_APP_STATS_USAGE_QUEUE_NAME:-v1-stats-usage}'
      - '_APP_STATS_RESOURCES_QUEUE_NAME=${_APP_STATS_RESOURCES_QUEUE_NAME:-v1-stats-resources}'
      - '_APP_STATS_RESOURCES_INTERVAL=${_APP_STATS_RESOURCES_INTERVAL:-3600}'
      - '_APP_EDITION=${_APP_EDITION:-self-hosted}'
      - '_APP_WORKER_PER_CORE=${_APP_WORKER_PER_CORE:-6}'
      - '_APP_POOL_ADAPTER=${_APP_POOL_ADAPTER:-stack}'
      - '_APP_LOCALE=${_APP_LOCALE:-en}'
      - '_APP_COMPRESSION_ENABLED=${_APP_COMPRESSION_ENABLED:-enabled}'
      - '_APP_COMPRESSION_MIN_SIZE_BYTES=${_APP_COMPRESSION_MIN_SIZE_BYTES:-1024}'
      - '_APP_CONSOLE_WHITELIST_ROOT=${_APP_CONSOLE_WHITELIST_ROOT:-enabled}'
      - '_APP_CONSOLE_WHITELIST_EMAILS=${_APP_CONSOLE_WHITELIST_EMAILS:-}'
      - '_APP_CONSOLE_SESSION_ALERTS=${_APP_CONSOLE_SESSION_ALERTS:-enabled}'
      - '_APP_CONSOLE_WHITELIST_IPS=${_APP_CONSOLE_WHITELIST_IPS:-}'
      - '_APP_CONSOLE_HOSTNAMES=${_APP_CONSOLE_HOSTNAMES:-}'
      - '_APP_CONSOLE_SCHEMA=${_APP_CONSOLE_SCHEMA:-}'
      - '_APP_CONSOLE_GITHUB_APP_ID=${_APP_CONSOLE_GITHUB_APP_ID:-}'
      - '_APP_CONSOLE_GITHUB_SECRET=${_APP_CONSOLE_GITHUB_SECRET:-}'
      - '_APP_CONSOLE_GITLAB_APP_ID=${_APP_CONSOLE_GITLAB_APP_ID:-}'
      - '_APP_CONSOLE_GITLAB_SECRET=${_APP_CONSOLE_GITLAB_SECRET:-}'
      - '_APP_CONSOLE_GITLAB_ENDPOINT=${_APP_CONSOLE_GITLAB_ENDPOINT:-}'
      - '_APP_CONSOLE_BITBUCKET_APP_ID=${_APP_CONSOLE_BITBUCKET_APP_ID:-}'
      - '_APP_CONSOLE_BITBUCKET_SECRET=${_APP_CONSOLE_BITBUCKET_SECRET:-}'
      - '_APP_CONSOLE_GOOGLE_APP_ID=${_APP_CONSOLE_GOOGLE_APP_ID:-}'
      - '_APP_CONSOLE_GOOGLE_SECRET=${_APP_CONSOLE_GOOGLE_SECRET:-}'
      - '_APP_SYSTEM_EMAIL_NAME=${_APP_SYSTEM_EMAIL_NAME:-Appwrite}'
      - '_APP_SYSTEM_EMAIL_ADDRESS=${_APP_SYSTEM_EMAIL_ADDRESS:-noreply@appwrite.io}'
      - '_APP_SYSTEM_TEAM_EMAIL=${_APP_SYSTEM_TEAM_EMAIL:-team@appwrite.io}'
      - '_APP_EMAIL_SECURITY=${_APP_EMAIL_SECURITY:-security@appwrite.io}'
      - '_APP_SYSTEM_RESPONSE_FORMAT=${_APP_SYSTEM_RESPONSE_FORMAT:-}'
      - '_APP_OPTIONS_ABUSE=${_APP_OPTIONS_ABUSE:-enabled}'
      - '_APP_OPTIONS_ABUSE_INCREASED_LIMIT_PROJECTS=${_APP_OPTIONS_ABUSE_INCREASED_LIMIT_PROJECTS:-}'
      - '_APP_OPTIONS_ROUTER_PROTECTION=${_APP_OPTIONS_ROUTER_PROTECTION:-disabled}'
      - '_APP_OPTIONS_FORCE_HTTPS=${_APP_OPTIONS_FORCE_HTTPS:-disabled}'
      - '_APP_OPTIONS_ROUTER_FORCE_HTTPS=${_APP_OPTIONS_ROUTER_FORCE_HTTPS:-disabled}'
      - '_APP_ROUTER_AUTO_CERTIFICATES=${_APP_ROUTER_AUTO_CERTIFICATES:-}'
      - _APP_OPENSSL_KEY_V1=$SERVICE_PASSWORD_64_APPWRITE
      - '_APP_NOTIFICATIONS_TRACKING_SECRET=${_APP_NOTIFICATIONS_TRACKING_SECRET:-$SERVICE_PASSWORD_64_NOTIFICATIONS}'
      # REQUIRED - Coolify shows a red border and blocks deploy until
      # _APP_DOMAIN is set to your bare hostname, e.g. appwrite.example.com
      # (no https://, no path, ONLY the hostname). _APP_DOMAIN_FUNCTIONS and
      # _APP_DOMAIN_SITES derive from it automatically - see the header.
      - '_APP_DOMAIN=${_APP_DOMAIN:?}'
      - '_APP_CONSOLE_DOMAIN=${_APP_CONSOLE_DOMAIN:-}'
      - _APP_CONSOLE_URL_SCHEME=root
      - '_APP_CONSOLE_TRUSTED_PROJECTS=${_APP_CONSOLE_TRUSTED_PROJECTS:-}'
      - '_APP_DOMAIN_TARGET_CNAME=${_APP_DOMAIN_TARGET_CNAME:-localhost}'
      - '_APP_DOMAIN_TARGET_AAAA=${_APP_DOMAIN_TARGET_AAAA:-::1}'
      - '_APP_DOMAIN_TARGET_A=${_APP_DOMAIN_TARGET_A:-127.0.0.1}'
      - '_APP_DOMAIN_TARGET_CAA=${_APP_DOMAIN_TARGET_CAA:-}'
      - '_APP_DNS=${_APP_DNS:-}'
      - '_APP_DOMAIN_FUNCTIONS=${_APP_DOMAIN_FUNCTIONS:-functions.${_APP_DOMAIN}}'
      - '_APP_REDIS_HOST=${_APP_REDIS_HOST:-redis}'
      - '_APP_REDIS_PORT=${_APP_REDIS_PORT:-6379}'
      - '_APP_REDIS_USER=${_APP_REDIS_USER:-}'
      - '_APP_REDIS_PASS=${_APP_REDIS_PASS:-}'
      - '_APP_DB_ADAPTER=${_APP_DB_ADAPTER:-postgresql}'
      - '_APP_DB_HOST=${_APP_DB_HOST:-postgresql}'
      - '_APP_DB_PORT=${_APP_DB_PORT:-5432}'
      - '_APP_DB_SCHEMA=${_APP_DB_SCHEMA:-appwrite}'
      - '_APP_DB_USER=${_APP_DB_USER:-$SERVICE_USER_POSTGRES}'
      - '_APP_DB_PASS=${_APP_DB_PASS:-$SERVICE_PASSWORD_POSTGRES}'
      - '_APP_DB_ROOT_PASS=${_APP_DB_ROOT_PASS:-$SERVICE_PASSWORD_64_MONGODBROOT}'
      - '_APP_DB_ADAPTER_VECTORSDB=${_APP_DB_ADAPTER_VECTORSDB:-postgresql}'
      - '_APP_DB_HOST_VECTORSDB=${_APP_DB_HOST_VECTORSDB:-postgresql}'
      - '_APP_DB_PORT_VECTORSDB=${_APP_DB_PORT_VECTORSDB:-5432}'
      - '_APP_DB_SCHEMA_VECTORSDB=${_APP_DB_SCHEMA_VECTORSDB:-}'
      - '_APP_DB_USER_VECTORSDB=${_APP_DB_USER_VECTORSDB:-}'
      - '_APP_DB_PASS_VECTORSDB=${_APP_DB_PASS_VECTORSDB:-}'
      - '_APP_DB_ADAPTER_DOCUMENTSDB=${_APP_DB_ADAPTER_DOCUMENTSDB:-mongodb}'
      - '_APP_DB_HOST_DOCUMENTSDB=${_APP_DB_HOST_DOCUMENTSDB:-mongodb}'
      - '_APP_DB_PORT_DOCUMENTSDB=${_APP_DB_PORT_DOCUMENTSDB:-27017}'
      - '_APP_DB_SCHEMA_DOCUMENTSDB=${_APP_DB_SCHEMA_DOCUMENTSDB:-}'
      - '_APP_DB_USER_DOCUMENTSDB=${_APP_DB_USER_DOCUMENTSDB:-}'
      - '_APP_DB_PASS_DOCUMENTSDB=${_APP_DB_PASS_DOCUMENTSDB:-}'
      - '_APP_CONNECTIONS_DATABASE_DOCUMENTSDB=${_APP_CONNECTIONS_DATABASE_DOCUMENTSDB:-}'
      - '_APP_CONNECTIONS_DATABASE_VECTORSDB=${_APP_CONNECTIONS_DATABASE_VECTORSDB:-}'
      - '_APP_SMTP_HOST=${_APP_SMTP_HOST:-}'
      - '_APP_SMTP_PORT=${_APP_SMTP_PORT:-}'
      - '_APP_SMTP_SECURE=${_APP_SMTP_SECURE:-}'
      - '_APP_SMTP_USERNAME=${_APP_SMTP_USERNAME:-}'
      - '_APP_SMTP_PASSWORD=${_APP_SMTP_PASSWORD:-}'
      - '_APP_STORAGE_LIMIT=${_APP_STORAGE_LIMIT:-30000000}'
      - '_APP_STORAGE_PREVIEW_LIMIT=${_APP_STORAGE_PREVIEW_LIMIT:-20000000}'
      - '_APP_STORAGE_ANTIVIRUS=${_APP_STORAGE_ANTIVIRUS:-disabled}'
      - '_APP_STORAGE_ANTIVIRUS_HOST=${_APP_STORAGE_ANTIVIRUS_HOST:-appwrite-clamav}'
      - '_APP_STORAGE_ANTIVIRUS_PORT=${_APP_STORAGE_ANTIVIRUS_PORT:-3310}'
      - '_APP_STORAGE_DEVICE=${_APP_STORAGE_DEVICE:-Local}'
      - '_APP_STORAGE_S3_ACCESS_KEY=${_APP_STORAGE_S3_ACCESS_KEY:-}'
      - '_APP_STORAGE_S3_SECRET=${_APP_STORAGE_S3_SECRET:-}'
      - '_APP_STORAGE_S3_REGION=${_APP_STORAGE_S3_REGION:-us-east-1}'
      - '_APP_STORAGE_S3_BUCKET=${_APP_STORAGE_S3_BUCKET:-}'
      - '_APP_STORAGE_S3_ENDPOINT=${_APP_STORAGE_S3_ENDPOINT:-}'
      - '_APP_STORAGE_DO_SPACES_ACCESS_KEY=${_APP_STORAGE_DO_SPACES_ACCESS_KEY:-}'
      - '_APP_STORAGE_DO_SPACES_SECRET=${_APP_STORAGE_DO_SPACES_SECRET:-}'
      - '_APP_STORAGE_DO_SPACES_REGION=${_APP_STORAGE_DO_SPACES_REGION:-us-east-1}'
      - '_APP_STORAGE_DO_SPACES_BUCKET=${_APP_STORAGE_DO_SPACES_BUCKET:-}'
      - '_APP_STORAGE_BACKBLAZE_ACCESS_KEY=${_APP_STORAGE_BACKBLAZE_ACCESS_KEY:-}'
      - '_APP_STORAGE_BACKBLAZE_SECRET=${_APP_STORAGE_BACKBLAZE_SECRET:-}'
      - '_APP_STORAGE_BACKBLAZE_REGION=${_APP_STORAGE_BACKBLAZE_REGION:-us-west-004}'
      - '_APP_STORAGE_BACKBLAZE_BUCKET=${_APP_STORAGE_BACKBLAZE_BUCKET:-}'
      - '_APP_STORAGE_LINODE_ACCESS_KEY=${_APP_STORAGE_LINODE_ACCESS_KEY:-}'
      - '_APP_STORAGE_LINODE_SECRET=${_APP_STORAGE_LINODE_SECRET:-}'
      - '_APP_STORAGE_LINODE_REGION=${_APP_STORAGE_LINODE_REGION:-eu-central-1}'
      - '_APP_STORAGE_LINODE_BUCKET=${_APP_STORAGE_LINODE_BUCKET:-}'
      - '_APP_STORAGE_WASABI_ACCESS_KEY=${_APP_STORAGE_WASABI_ACCESS_KEY:-}'
      - '_APP_STORAGE_WASABI_SECRET=${_APP_STORAGE_WASABI_SECRET:-}'
      - '_APP_STORAGE_WASABI_REGION=${_APP_STORAGE_WASABI_REGION:-eu-central-1}'
      - '_APP_STORAGE_WASABI_BUCKET=${_APP_STORAGE_WASABI_BUCKET:-}'
      - '_APP_COMPUTE_SIZE_LIMIT=${_APP_COMPUTE_SIZE_LIMIT:-30000000}'
      - '_APP_FUNCTIONS_TIMEOUT=${_APP_FUNCTIONS_TIMEOUT:-900}'
      - '_APP_SITES_TIMEOUT=${_APP_SITES_TIMEOUT:-60}'
      - '_APP_COMPUTE_BUILD_TIMEOUT=${_APP_COMPUTE_BUILD_TIMEOUT:-900}'
      - '_APP_COMPUTE_CPUS=${_APP_COMPUTE_CPUS:-0}'
      - '_APP_COMPUTE_MEMORY=${_APP_COMPUTE_MEMORY:-0}'
      - '_APP_FUNCTIONS_RUNTIMES=${_APP_FUNCTIONS_RUNTIMES:-node-22}'
      - '_APP_SITES_RUNTIMES=${_APP_SITES_RUNTIMES:-static-1,node-22}'
      - '_APP_DOMAIN_SITES=${_APP_DOMAIN_SITES:-sites.${_APP_DOMAIN}}'
      - '_APP_EXECUTOR_SECRET=${_APP_EXECUTOR_SECRET:-$SERVICE_PASSWORD_64_EXECUTOR}'
      - '_APP_EXECUTOR_HOST=${_APP_EXECUTOR_HOST:-http://openruntimes-executor/v1}'
      # Volume the orchestrator attaches to build-job containers. Coolify
      # renames every stack volume to "<stack-uuid>_<name>", so under Coolify
      # set this env var to that prefixed name (find it with
      # `docker volume ls | grep builds`). Wrong name = builds finish but
      # deployments fail with "Build produced no output artifact".
      - '_APP_BUILDS_VOLUME=${_APP_BUILDS_VOLUME:-appwrite-builds}'
      - '_APP_JOBS_HOST=${_APP_JOBS_HOST:-http://orchestrator:8080}'
      - '_APP_JOBS_SECRET=${_APP_JOBS_SECRET:-$SERVICE_PASSWORD_64_JOBS}'
      - '_APP_JOBS_ENDPOINT=${_APP_JOBS_ENDPOINT:-http://appwrite}'
      - '_APP_LOGGING_CONFIG=${_APP_LOGGING_CONFIG:-}'
      - '_APP_LOGGING_FORMAT=${_APP_LOGGING_FORMAT:-pretty}'
      - '_APP_LOCKING_ENABLED=${_APP_LOCKING_ENABLED:-}'
      - '_APP_MAINTENANCE_INTERVAL=${_APP_MAINTENANCE_INTERVAL:-86400}'
      - '_APP_MAINTENANCE_RETENTION_EXECUTION=${_APP_MAINTENANCE_RETENTION_EXECUTION:-1209600}'
      - '_APP_MAINTENANCE_RETENTION_CACHE=${_APP_MAINTENANCE_RETENTION_CACHE:-2592000}'
      - '_APP_MAINTENANCE_RETENTION_ABUSE=${_APP_MAINTENANCE_RETENTION_ABUSE:-86400}'
      - '_APP_MAINTENANCE_RETENTION_AUDIT=${_APP_MAINTENANCE_RETENTION_AUDIT:-1209600}'
      - '_APP_MAINTENANCE_RETENTION_AUDIT_CONSOLE=${_APP_MAINTENANCE_RETENTION_AUDIT_CONSOLE:-15778800}'
      - '_APP_MAINTENANCE_RETENTION_USAGE_HOURLY=${_APP_MAINTENANCE_RETENTION_USAGE_HOURLY:-8640000}'
      - '_APP_MAINTENANCE_RETENTION_SCHEDULES=${_APP_MAINTENANCE_RETENTION_SCHEDULES:-86400}'
      - '_APP_SMS_PROVIDER=${_APP_SMS_PROVIDER:-}'
      - '_APP_SMS_FROM=${_APP_SMS_FROM:-}'
      - '_APP_GRAPHQL_INTROSPECTION=${_APP_GRAPHQL_INTROSPECTION:-enabled}'
      - '_APP_GRAPHQL_MAX_BATCH_SIZE=${_APP_GRAPHQL_MAX_BATCH_SIZE:-10}'
      - '_APP_GRAPHQL_MAX_COMPLEXITY=${_APP_GRAPHQL_MAX_COMPLEXITY:-250}'
      - '_APP_GRAPHQL_MAX_DEPTH=${_APP_GRAPHQL_MAX_DEPTH:-4}'
      - '_APP_VCS_GITHUB_APP_NAME=${_APP_VCS_GITHUB_APP_NAME:-}'
      - '_APP_VCS_GITHUB_PRIVATE_KEY=${_APP_VCS_GITHUB_PRIVATE_KEY:-disabled}'
      - '_APP_VCS_GITHUB_APP_ID=${_APP_VCS_GITHUB_APP_ID:-}'
      - '_APP_VCS_GITHUB_WEBHOOK_SECRET=${_APP_VCS_GITHUB_WEBHOOK_SECRET:-}'
      - '_APP_VCS_GITHUB_CLIENT_SECRET=${_APP_VCS_GITHUB_CLIENT_SECRET:-}'
      - '_APP_VCS_GITHUB_CLIENT_ID=${_APP_VCS_GITHUB_CLIENT_ID:-}'
      - '_APP_VCS_GITEA_ENDPOINT=${_APP_VCS_GITEA_ENDPOINT:-}'
      - '_APP_VCS_GITEA_BROWSER_ENDPOINT=${_APP_VCS_GITEA_BROWSER_ENDPOINT:-}'
      - '_APP_VCS_GITEA_CLIENT_ID=${_APP_VCS_GITEA_CLIENT_ID:-}'
      - '_APP_VCS_GITEA_CLIENT_SECRET=${_APP_VCS_GITEA_CLIENT_SECRET:-}'
      - '_APP_VCS_GITEA_WEBHOOK_SECRET=${_APP_VCS_GITEA_WEBHOOK_SECRET:-}'
      - '_APP_VCS_GITLAB_ENDPOINT=${_APP_VCS_GITLAB_ENDPOINT:-}'
      - '_APP_VCS_GITLAB_CLIENT_ID=${_APP_VCS_GITLAB_CLIENT_ID:-}'
      - '_APP_VCS_GITLAB_CLIENT_SECRET=${_APP_VCS_GITLAB_CLIENT_SECRET:-}'
      - '_APP_VCS_GITLAB_WEBHOOK_SECRET=${_APP_VCS_GITLAB_WEBHOOK_SECRET:-}'
      - '_APP_VCS_BITBUCKET_CLIENT_ID=${_APP_VCS_BITBUCKET_CLIENT_ID:-}'
      - '_APP_VCS_BITBUCKET_CLIENT_SECRET=${_APP_VCS_BITBUCKET_CLIENT_SECRET:-}'
      - '_APP_VCS_BITBUCKET_WEBHOOK_SECRET=${_APP_VCS_BITBUCKET_WEBHOOK_SECRET:-}'
      - '_APP_VCS_ORIGIN_CLIENT_ID=${_APP_VCS_ORIGIN_CLIENT_ID:-}'
      - '_APP_VCS_ORIGIN_PRIVATE_KEY=${_APP_VCS_ORIGIN_PRIVATE_KEY:-}'
      - '_APP_VCS_WEBHOOK_URL=${_APP_VCS_WEBHOOK_URL:-http://appwrite/v1}'
      - '_APP_MIGRATIONS_FIREBASE_CLIENT_ID=${_APP_MIGRATIONS_FIREBASE_CLIENT_ID:-}'
      - '_APP_MIGRATIONS_FIREBASE_CLIENT_SECRET=${_APP_MIGRATIONS_FIREBASE_CLIENT_SECRET:-}'
      - '_APP_ASSISTANT_OPENAI_API_KEY=${_APP_ASSISTANT_OPENAI_API_KEY:-}'
      - '_APP_CONSOLE_COUNTRIES_DENYLIST=${_APP_CONSOLE_COUNTRIES_DENYLIST:-}'
      - '_APP_EXPERIMENT_LOGGING_PROVIDER=${_APP_EXPERIMENT_LOGGING_PROVIDER:-}'
      - '_APP_EXPERIMENT_LOGGING_CONFIG=${_APP_EXPERIMENT_LOGGING_CONFIG:-}'
      - '_APP_DATABASE_SHARED_TABLES=${_APP_DATABASE_SHARED_TABLES:-}'
      - '_APP_DATABASE_SHARED_NAMESPACE=${_APP_DATABASE_SHARED_NAMESPACE:-}'
      - '_APP_FUNCTIONS_CREATION_ABUSE_LIMIT=${_APP_FUNCTIONS_CREATION_ABUSE_LIMIT:-5000}'
      - '_APP_CUSTOM_DOMAIN_DENY_LIST=${_APP_CUSTOM_DOMAIN_DENY_LIST:-}'
      - '_APP_TRUSTED_HEADERS=${_APP_TRUSTED_HEADERS:-x-forwarded-for}'
