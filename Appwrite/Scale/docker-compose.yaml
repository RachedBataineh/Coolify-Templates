      - '_APP_GEO_SECRET=${_APP_GEO_SECRET:-$SERVICE_PASSWORD_64_GEO}'
      - '_APP_GEO_ENDPOINT=${_APP_GEO_ENDPOINT:-http://appwrite-geo/v1}'
