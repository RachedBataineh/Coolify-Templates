      - '_APP_EMBEDDING=${_APP_EMBEDDING:-disabled}'

  # --------------------------------------------------------------------------
  # Console IV - served at `/` of the shared Coolify domain (port 3000)
  # --------------------------------------------------------------------------
  appwrite-console:
    image: 'appwrite/new:1.1.16'
    container_name: appwrite-console
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    networks:
      - appwrite
    environment:
      - SERVICE_URL_APPWRITE_3000=/
      - VITE_CONSOLE_PROFILE=self-hosted
      - APPWRITE_ENDPOINT_SAME_ORIGIN=true
      - VITE_GROWTH_ENDPOINT=https://growth.appwrite.io/v1

  # --------------------------------------------------------------------------
  # Realtime - websocket endpoint /v1/realtime
  # --------------------------------------------------------------------------
  appwrite-realtime:
    # no container_name on purpose: this service can be replicated
    image: '${_APP_IMAGE:-appwrite/appwrite}:${_APP_VERSION:-2.0.0}'
    entrypoint: realtime
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    networks:
      - appwrite
    # Raise the fd limit so Swoole accepts its max_connection setting instead
    # of warning "max_connection ... reset to 1024" (capped by the nofile ulimit).
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      - '${_APP_DB_HOST:-postgresql}'
      - redis
    environment:
      # Port-less on purpose: declaring the same port-suffixed variable on
      # two services with different paths makes Coolify merge their routers.
      # Without a port label Traefik uses the image's exposed port 80 - correct.
      - SERVICE_URL_APPWRITE=/v1/realtime
      - '_APP_ENV=${_APP_ENV:-production}'
      - '_APP_USAGE_STATS=${_APP_USAGE_STATS:-enabled}'
      - '_APP_STATS_USAGE_QUEUE_NAME=${_APP_STATS_USAGE_QUEUE_NAME:-v1-stats-usage}'
      - '_APP_WORKER_PER_CORE=${_APP_WORKER_PER_CORE:-6}'
      - '_APP_OPTIONS_ABUSE=${_APP_OPTIONS_ABUSE:-enabled}'
      - '_APP_OPTIONS_ROUTER_PROTECTION=${_APP_OPTIONS_ROUTER_PROTECTION:-disabled}'
      - '_APP_CONSOLE_HOSTNAMES=${_APP_CONSOLE_HOSTNAMES:-}'
      - '_APP_REALTIME_TAIL_RATE=${_APP_REALTIME_TAIL_RATE:-50}'
      - _APP_OPENSSL_KEY_V1=$SERVICE_PASSWORD_64_APPWRITE
      - '_APP_REDIS_HOST=${_APP_REDIS_HOST:-redis}'
      - '_APP_REDIS_PORT=${_APP_REDIS_PORT:-6379}'
      - '_APP_REDIS_USER=${_APP_REDIS_USER:-}'
      - '_APP_REDIS_PASS=${_APP_REDIS_PASS:-}'
      - '_APP_DB_ADAPTER=${_APP_DB_ADAPTER:-postgresql}'
      - '_APP_DB_HOST=${_APP_DB_HOST:-postgresql}'
      - '_APP_DB_PORT=${_APP_DB_PORT:-5432}'
      - '_APP_DB_SCHEMA=${_APP_DB_SCHEMA:-appwrite}'
      - '_APP_DB_USER=${_APP_DB_USER:-$SERVICE_USER_POSTGRES}'
      - '_APP_DB_PASS=${_APP_DB_PASS:-$SERVICE_PASSWORD_POSTGRES}'
      - '_APP_DB_ADAPTER_VECTORSDB=${_APP_DB_ADAPTER_VECTORSDB:-postgresql}'
