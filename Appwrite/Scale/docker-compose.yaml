  # --------------------------------------------------------------------------
  # ClickHouse - usage stats + optional execution logs dual-write
  # --------------------------------------------------------------------------
  clickhouse:
    image: 'clickhouse/clickhouse-server:26.4.3-alpine'
    container_name: appwrite-clickhouse
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    networks:
      - appwrite
    environment:
      - CLICKHOUSE_DB=appwrite
      - CLICKHOUSE_USER=appwrite
      - CLICKHOUSE_PASSWORD=${_APP_USAGE_PASS:-$SERVICE_PASSWORD_CLICKHOUSE}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - appwrite-clickhouse:/var/lib/clickhouse:rw
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        - CMD-SHELL
        - 'clickhouse-client --user "$$CLICKHOUSE_USER" --password "$$CLICKHOUSE_PASSWORD" --query "SELECT 1" >/dev/null'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # --------------------------------------------------------------------------
