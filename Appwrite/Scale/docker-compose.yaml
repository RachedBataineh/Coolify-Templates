      - OPR_EXECUTOR_DOCKER_HUB_PASSWORD=${_APP_DOCKER_HUB_PASSWORD:-}
      - OPR_EXECUTOR_ENV=${_APP_ENV:-production}
      - OPR_EXECUTOR_RUNTIMES=${_APP_FUNCTIONS_RUNTIMES:-node-22},${_APP_SITES_RUNTIMES:-static-1,node-22}
      - OPR_EXECUTOR_SECRET=${_APP_EXECUTOR_SECRET:-$SERVICE_PASSWORD_64_EXECUTOR}
      - OPR_EXECUTOR_RUNTIME_VERSIONS=v5
      - OPEN_RUNTIMES_NFT=${_APP_OPEN_RUNTIMES_NFT:-enabled}
      - OPR_EXECUTOR_LOGGING_CONFIG=${_APP_LOGGING_CONFIG:-}
      - OPR_EXECUTOR_CONNECTION_STORAGE=${_APP_EXECUTOR_CONNECTION_STORAGE:-local://localhost}
      - OPR_EXECUTOR_CONNECTION_BUILD_CACHE_STORAGE=
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -fsS -H "Authorization: Bearer $$OPR_EXECUTOR_SECRET" http://localhost/v1/health >/dev/null'
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # --------------------------------------------------------------------------
  # Orchestrator - build jobs backend for functions/sites (needs docker.sock)
  # --------------------------------------------------------------------------
  orchestrator:
    image: 'ghcr.io/open-runtimes/orchestrator/orchestrator:1.9.2'
    container_name: orchestrator
    hostname: orchestrator
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    user: root
    networks:
      - appwrite
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - ORCHESTRATOR_BACKEND=docker
      # The jobs plane and the serving planes read the network under different
      # names; both name the network the workload containers join.
      - ORCHESTRATOR_NETWORK=appwrite
      - DOCKER_NETWORK=appwrite
      - ARTIFACT_ENDPOINT=http://orchestrator:8080
      - S3_ENDPOINT=${_APP_STORAGE_S3_ENDPOINT:-}
      - S3_REGION=${_APP_STORAGE_S3_REGION:-us-east-1}
      - S3_ACCESS_KEY_ID=${_APP_STORAGE_S3_ACCESS_KEY:-}
      - S3_SECRET_ACCESS_KEY=${_APP_STORAGE_S3_SECRET:-}

  # --------------------------------------------------------------------------
  # Databases
  # --------------------------------------------------------------------------
  postgresql:
    image: 'appwrite/postgres:0.1.0'
    container_name: appwrite-postgresql
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    networks:
      - appwrite
    volumes:
      - appwrite-postgresql:/var/lib/postgresql:rw
    environment:
      - POSTGRES_DB=${_APP_DB_SCHEMA:-appwrite}
      - POSTGRES_USER=${_APP_DB_USER:-$SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${_APP_DB_PASS:-$SERVICE_PASSWORD_POSTGRES}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${_APP_DB_USER:-$SERVICE_USER_POSTGRES} -d ${_APP_DB_SCHEMA:-appwrite}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    command:
      - postgres

  # MongoDB for DocumentsDB (profile `mongodb` + _APP_DOCUMENTSDB=enabled)
  mongodb:
    image: 'mongo:8.2.5'
    container_name: appwrite-mongodb
    profiles:
      - mongodb
    exclude_from_hc: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    networks:
      - appwrite
    volumes:
      - appwrite-mongodb:/data/db
      - appwrite-mongodb-keyfile:/data/keyfile
    configs:
      - source: mongo-init-js
        target: /docker-entrypoint-initdb.d/mongo-init.js
      - source: mongo-entrypoint-sh
        target: /mongo-entrypoint.sh
        mode: 0755
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=${_APP_DB_ROOT_PASS:-$SERVICE_PASSWORD_64_MONGODBROOT}
      - MONGO_INITDB_DATABASE=${_APP_DB_SCHEMA:-appwrite}
      - MONGO_INITDB_USERNAME=${_APP_DB_USER:-$SERVICE_USER_POSTGRES}
      - MONGO_INITDB_PASSWORD=${_APP_DB_PASS:-$SERVICE_PASSWORD_POSTGRES}
    entrypoint:
      - /bin/bash
      - /mongo-entrypoint.sh
    healthcheck:
      test: |
        bash -c "
          mongosh -u root -p ${_APP_DB_ROOT_PASS:-$SERVICE_PASSWORD_64_MONGODBROOT} --authenticationDatabase admin --quiet --eval \"
            try {
              const hello = db.adminCommand({hello: 1});
              if (hello.isWritablePrimary && hello.setName === 'rs0') {
                quit(0);
              }
            } catch (e) {}

            try {
              rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongodb:27017'}]});
            } catch (e) {}

            quit(1);
          \" 2>/dev/null
        "
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  # Local embeddings model server (profile `embedding` + _APP_EMBEDDING=enabled)
  appwrite-embedding:
    image: 'appwrite/embedding:0.3.1'
    container_name: appwrite-embedding
    profiles:
      - embedding
    exclude_from_hc: true
    restart: unless-stopped
    environment:
      - EMBEDDING_MODELS=${_APP_EMBEDDING_MODELS:-nomic-embed-text}
    volumes:
      - appwrite-models:/home/embedder/models
    networks:
      - appwrite

  redis:
    image: 'redis:7.4.7-alpine'
    container_name: appwrite-redis
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    command:
      - redis-server
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --maxmemory-samples
      - "5"
    networks:
      - appwrite
    volumes:
      - appwrite-redis:/data:rw
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 12

# ------------------------------------------------------------------------------
# Networks - pinned names. Function/site runtime containers spawned by the
# executor join `runtimes`; build workers spawned by the orchestrator join
# `appwrite`; both are created by this stack so names must stay stable.
# Coolify's proxy is attached automatically to the `appwrite` network.
# ------------------------------------------------------------------------------
networks:
  appwrite:
    name: appwrite
  runtimes:
    name: runtimes

# ------------------------------------------------------------------------------
# Volumes - `appwrite-builds` keeps its pinned (unprefixed) name so the
# orchestrator can attach it to build workers by a stable name
# (see _APP_BUILDS_VOLUME).
# ------------------------------------------------------------------------------
volumes:
  appwrite-postgresql:
  appwrite-mongodb:
  appwrite-mongodb-keyfile:
  appwrite-redis:
  appwrite-cache:
  appwrite-clickhouse:
  appwrite-uploads:
  appwrite-imports:
  appwrite-certificates:
  appwrite-functions:
  appwrite-sites:
  appwrite-builds:
    name: appwrite-builds
  appwrite-config:
  appwrite-models:

# Mongo helper files (inline so this stays a single-file Coolify template)
configs:
  mongo-init-js:
    content: |
      // mongo-init.js

      // Switch to the admin database
      const adminDb = db.getSiblingDB('admin');

      // Get username and password from environment variables
      const username = process.env.MONGO_INITDB_USERNAME;
      const password = process.env.MONGO_INITDB_PASSWORD;
      const database = process.env.MONGO_INITDB_DATABASE;

      // Create the user
      adminDb.createUser({
        user: username,
        pwd: password,
        roles: [
          { role: 'readWrite', db: database }
        ]
      });
  mongo-entrypoint-sh:
    # NOTE: '$$' is escaped on purpose - compose must not interpolate the
    # shell variables; the container receives a literal '$KEYFILE_PATH'.
    content: |
      #!/bin/bash
      set -e

      # Fix keyfile permissions if mounted from volume
      KEYFILE_PATH="/data/keyfile/mongo-keyfile"

      if [ ! -f "$$KEYFILE_PATH" ]; then
        echo "Generating random MongoDB keyfile..."
        mkdir -p /data/keyfile
        openssl rand -base64 756 > "$$KEYFILE_PATH"
      fi

      chmod 400 "$$KEYFILE_PATH"
      chown mongodb:mongodb "$$KEYFILE_PATH" 2>/dev/null || chown 999:999 "$$KEYFILE_PATH"

      # Use MongoDB's standard entrypoint with our command
      exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --auth --keyFile "$$KEYFILE_PATH"
