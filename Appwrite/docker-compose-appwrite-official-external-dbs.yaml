        - 'curl -fsS -H "Authorization: Bearer $$OPR_EXECUTOR_SECRET" http://localhost/v1/health > /dev/null || exit 1'
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
  orchestrator:
