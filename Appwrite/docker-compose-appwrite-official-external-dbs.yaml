      - 'S3_ACCESS_KEY_ID=${_APP_STORAGE_S3_ACCESS_KEY}'
      - 'S3_SECRET_ACCESS_KEY=${_APP_STORAGE_S3_SECRET}'
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock'
    healthcheck:
      test:
        - CMD
        - /ko-app/orchestrator
        - '-check-ready'
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

# ---------------------------------------------------------------------------
# Redis AUTH fix for the queue layer (upstream bug, appwrite/appwrite#13554):
# utopia-php/queue's Connection\Redis never authenticates, so passworded
# external Redis fails with "NOAUTH Authentication required" on publish AND
# consume. This config overlays the patched file into every appwrite-image
# service that talks to Redis. Inert when Redis has no password. Remove when
# an Appwrite release > 2.0.0 carries the fix (verify: no NOAUTH in logs).
# ---------------------------------------------------------------------------
configs:
  queue-redis-auth:
    content: |
      <?php

      namespace Utopia\Queue\Connection;

      use Utopia\Queue\Connection;

      class Redis implements Connection
      {
          protected const int CONNECT_MAX_ATTEMPTS = 5;
          protected const int CONNECT_BACKOFF_MS = 100;
          protected const int CONNECT_MAX_BACKOFF_MS = 3_000;
          protected ?\Redis $$redis = null;

          public function __construct(protected string $$host, protected int $$port = 6379, protected ?string $$user = null, protected ?string $$password = null, protected float $$connectTimeout = -1, protected float $$readTimeout = -1) {}

          public function rightPopLeftPushArray(string $$queue, string $$destination, int $$timeout): array|false
          {
              $$response = $$this->rightPopLeftPush($$queue, $$destination, $$timeout);

              if (!$$response) {
                  return false;
              }

              return json_decode($$response, true);
          }
          public function rightPopLeftPush(string $$queue, string $$destination, int $$timeout): string|false
          {
              $$response = $$this->getRedis()->bRPopLPush($$queue, $$destination, $$timeout);

              if (!$$response) {
                  return false;
              }

              return $$response;
          }
          public function rightPushArray(string $$queue, array $$value): bool
          {
              return (bool) $$this->getRedis()->rPush($$queue, json_encode($$value));
          }

          public function rightPush(string $$queue, string $$value): bool
          {
              return (bool) $$this->getRedis()->rPush($$queue, $$value);
          }

          public function leftPushArray(string $$queue, array $$value): bool
          {
              return (bool) $$this->getRedis()->lPush($$queue, json_encode($$value));
          }

          public function leftPush(string $$queue, string $$value): bool
          {
              return (bool) $$this->getRedis()->lPush($$queue, $$value);
          }

          public function leftPushMany(string $$queue, array $$payloads): bool
          {
              if ($$payloads === []) {
                  return true;
              }

              return (bool) $$this->getRedis()->lPush($$queue, ...$$payloads);
          }

          public function rightPushMany(string $$queue, array $$payloads): bool
          {
              if ($$payloads === []) {
                  return true;
              }

              return (bool) $$this->getRedis()->rPush($$queue, ...$$payloads);
          }

          /** @phpstan-impure */
          public function rightPopArray(string $$queue, int $$timeout): array|false
          {
              $$response = $$this->rightPop($$queue, $$timeout);

              if ($$response === false) {
                  return false;
              }

              return json_decode($$response, true) ?? false;
          }

          public function rightPop(string $$queue, int $$timeout): string|false
          {
              $$response = $$this->getRedis()->brPop([$$queue], $$timeout);

              if (empty($$response)) {
                  return false;
              }

              return $$response[1];
          }

          public function leftPopArray(string $$queue, int $$timeout): array|false
          {
              $$response = $$this->getRedis()->blPop($$queue, $$timeout);

              if (empty($$response)) {
                  return false;
              }

              return json_decode((string) $$response[1], true) ?? false;
          }

          public function leftPop(string $$queue, int $$timeout): string|false
          {
              $$response = $$this->getRedis()->blPop($$queue, $$timeout);

              if (empty($$response)) {
                  return false;
              }

              return $$response[1];
          }

          public function listRemove(string $$queue, string $$key): bool
          {
              return (bool) $$this->getRedis()->lRem($$queue, $$key, 1);
          }

          public function remove(string $$key): bool
          {
              return (bool) $$this->getRedis()->del($$key);
          }

          public function setArray(string $$key, array $$value, int $$ttl = 0): bool
          {
              return $$this->set($$key, json_encode($$value), $$ttl);
          }

          public function set(string $$key, string $$value, int $$ttl = 0): bool
          {
              if ($$ttl > 0) {
                  return $$this->getRedis()->setex($$key, $$ttl, $$value);
              }
              return $$this->getRedis()->set($$key, $$value);
          }

          public function get(string $$key): array|string|null
          {
              return $$this->getRedis()->get($$key);
          }

          public function listSize(string $$key): int
          {
              return $$this->getRedis()->lLen($$key);
          }

          public function increment(string $$key): int
          {
              return $$this->getRedis()->incr($$key);
          }

          public function decrement(string $$key): int
          {
              return $$this->getRedis()->decr($$key);
          }

          public function listRange(string $$key, int $$total, int $$offset): array
          {
              $$start = $$offset;
              $$end = $$start + $$total - 1;

              return $$this->getRedis()->lRange($$key, $$start, $$end);
          }

          public function ping(): bool
          {
              try {
                  $$this->getRedis()->ping();

                  return true;
              } catch (\Exception) {
                  return false;
              }
          }

          public function close(): void
          {
              try {
                  $$this->redis?->close();
              } catch (\Throwable) {
              } finally {
                  $$this->redis = null;
              }
          }

          protected function getRedis(): \Redis
          {
              if ($$this->redis instanceof \Redis) {
                  return $$this->redis;
              }

              $$connectTimeout = $$this->connectTimeout < 0 ? 0 : $$this->connectTimeout;

              for ($$attempt = 1; $$attempt <= self::CONNECT_MAX_ATTEMPTS; $$attempt++) {
                  $$redis = new \Redis();

                  try {
                      $$redis->connect($$this->host, $$this->port, $$connectTimeout);
                      $$awp = $$this->password ?? getenv('_APP_REDIS_PASS');
                      $$awu = $$this->user ?? getenv('_APP_REDIS_USER');
                      if (!empty($$awp)) {
                          !empty($$awu) ? $$redis->auth([$$awu, $$awp]) : $$redis->auth($$awp);
                      } /* APPREDIS_PATCH (compose config overlay) */

                      if ($$this->readTimeout >= 0) {
                          $$redis->setOption(\Redis::OPT_READ_TIMEOUT, $$this->readTimeout);
                      }

                      $$this->redis = $$redis;
                      return $$this->redis;
                  } catch (\RedisException $$e) {
                      try {
                          $$redis->close();
                      } catch (\Throwable) {
                      }

                      if ($$attempt === self::CONNECT_MAX_ATTEMPTS) {
                          throw new \RedisException(
                              \sprintf(
                                  'Failed to connect to Redis at %s:%d after %d attempts: %s',
                                  $$this->host,
                                  $$this->port,
                                  self::CONNECT_MAX_ATTEMPTS,
                                  $$e->getMessage(),
                              ),
                              $$e->getCode(),
                              $$e,
                          );
                      }

                      // Exponential backoff with full jitter to avoid thundering herd on recovery.
                      $$backoffMs = min(
                          self::CONNECT_MAX_BACKOFF_MS,
                          self::CONNECT_BACKOFF_MS * (2 ** ($$attempt - 1)),
                      );
                      usleep(mt_rand(0, $$backoffMs) * 1000);
                  }
              }

              throw new \RedisException(\sprintf(
                  'Unreachable: Redis connect loop for %s:%d exited after %d attempts without success or exception.',
                  $$this->host,
                  $$this->port,
                  self::CONNECT_MAX_ATTEMPTS,
              ));
          }
      }

volumes:
  appwrite-uploads:
  appwrite-imports:
  appwrite-cache:
  appwrite-config:
  appwrite-certificates:
  appwrite-functions:
  appwrite-sites:
  appwrite-builds:
