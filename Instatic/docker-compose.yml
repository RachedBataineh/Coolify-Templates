# Instatic (Postgres mode) — minimal Coolify-compatible compose.
#
# Magic variables (auto-generated by Coolify, reusable across services):
#   SERVICE_FQDN_APP_3001           — assigns domain + routes traffic to app:3001
#   SERVICE_URL_APP                 — clean public URL (no port) for PUBLIC_ORIGIN
#   SERVICE_PASSWORD_64_POSTGRES    — Postgres password (shared by postgres + DATABASE_URL)
#   SERVICE_REALBASE64_32_INSTATIC  — 32-byte base64 key for INSTATIC_SECRET_KEY
#   (use REALBASE64, not BASE64 — the latter is NOT real base64 and crashes masterKey.ts)
#
# Back up INSTATIC_SECRET_KEY (docker exec <app> printenv INSTATIC_SECRET_KEY):
# losing it makes all stored AI creds / plugin secrets / TOTP seeds undecryptable.
# If you switch to a custom domain, override PUBLIC_ORIGIN in Coolify's env editor.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-instatic}
      - POSTGRES_USER=${POSTGRES_USER:-instatic}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_64_POSTGRES}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: ${INSTATIC_IMAGE:-ghcr.io/corebunch/instatic:latest}
    restart: unless-stopped
    # No host ports: Coolify's proxy routes public traffic to app:3001 over the
    # internal Docker network. Exposing the port would bypass the proxy and
    # allow public X-Forwarded-For spoofing.
    environment:
      - SERVICE_FQDN_APP_3001
      - PORT=3001
      - DATABASE_URL=postgres://${POSTGRES_USER:-instatic}:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/${POSTGRES_DB:-instatic}
      - UPLOADS_DIR=/app/uploads
      - STATIC_DIR=/app/dist
      - INSTATIC_SECRET_KEY=${SERVICE_REALBASE64_32_INSTATIC}
      - PUBLIC_ORIGIN=${SERVICE_URL_APP}
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "run", "server/healthcheck.ts"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  postgres_data:
  uploads:
